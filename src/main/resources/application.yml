spring:
  profiles:
    default: local

  datasource:
    url: "jdbc:h2:mem:library;MODE=MYSQL;NON_KEYWORDS=USER"
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USER}
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none

  security:
    jwt:
      token:
        secret: ${JWT_SECRET}
        access-token-lifetime-minutes: ${ACCESS_TOKEN_LIFETIME}
        refresh-token-lifetime-days: ${REFRESH_TOKEN_LIFETIME}
      cookie:
        access-token-name: "accessToken"
        refresh-token-name: "refreshToken"
        access-token-max-age: ${ACCESS_TOKEN_MAX_AGE}
        refresh-token-max-age: ${REFRESH_TOKEN_MAX_AGE}


---

spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
    enabled: true


---

spring:
  config:
    activate:
      on-profile: test

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
